http_port: 6152
socks_port: 6153
vif_only: true
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://1.1.1.1/generate_204
direct_latency_test_url: http://wifi.vivo.com.cn/generate_204
dns:
  bootstrap:
  - system
  upstreams:
    Domestic-DNS:
    - 223.5.5.5
    - 119.29.29.29
    Domestic-Encrypted-DNS:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    Foreign-Encrypted-DNS:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  forward:
  - proxy_rule_set:
      match: https://cdn.jsdelivr.net/gh/Repcz/Tool@X/Egern/Rules/Reject.yaml
      value: REJECT
      disabled: false
  - proxy_rule_set:
      match: https://cdn.jsdelivr.net/gh/Accademia/Additional_Rule_For_Clash@master/GeositeCN/GeositeCN.yaml
      value: Domestic-DNS
      disabled: false
  - domain_wildcard:
      match: '*'
      value: Domestic-Encrypted-DNS
      disabled: false
  hosts:
    dns.google:
    - 8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844
    cloudflare-dns.com:
    - 104.16.249.249, 104.16.248.249, 2606:4700::6810:f8f9, 2606:4700::6810:f9f9
    dns.alidns.com:
    - 223.5.5.5, 223.6.6.6, 2400:3200:baba::1, 2400:3200::1
    doh.pub:
    - 1.12.12.12, 120.53.53.53
    dot.pub:
    - 1.12.12.12, 120.53.53.53
  proxy_nameservers:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
real_ip_domains:
- lancache.steamcontent.com
- '*.msftconnecttest.com'
- '*.msftncsi.com'
- '*.srv.nintendo.net'
- '*.stun.playstation.net'
- xbox.*.microsoft.com
- '*.xboxlive.com'
- '*.logon.battlenet.com.cn'
- '*.logon.battle.net'
- stun.l.google.com
- easy-login.10099.com.cn
- '*-update.xoyocdn.com'
- '*.prod.cloud.netflix.com'
- appboot.netflix.com
- '*-appboot.netflix.com'
mitm:
  enabled: true
  hostnames:
    includes:
    - weather-data.apple.com
    - weather-analytics-events.apple.com
    - pluginhub.kelee.one
    - hub.kelee.one
    - surge.qingr.moe
    - t.me
    - telegram.me
policy_groups:
- select:
    name: 良心云
    urls:
    - YOUR_良心云_SUBSCRIPTION_URL
- select:
    name: 宝可梦
    urls:
    - YOUR_宝可梦_SUBSCRIPTION_URL
    filter: (?i)(?:0\.[1-9]X|1X)
- select:
    name: 美国拼车
    urls:
    - YOUR_US_SUBSCRIPTION_URL
    prev_hop: 🇺🇸 美国-故选
- select:
    name: 香港拼车
    urls:
    - YOUR_HK_SUBSCRIPTION_URL
    prev_hop: 🇭🇰 香港-故选
- select:
    name: 🇭🇰 香港-手选
    policies:
    - 良心云
    - 宝可梦
    flatten: true
    filter: (?i)🇭🇰|香港|(\b(HK|Hong|HongKong)\b)
- auto_test:
    name: 🇭🇰 香港-智能
    policies:
    - 良心云
    - 宝可梦
    flatten: true
    filter: (?i)🇭🇰|香港|(\b(HK|Hong|HongKong)\b)
    interval: 300
    tolerance: 100
    timeout: 5
    hidden: true
- fallback:
    name: 🇭🇰 香港-故选
    policies:
    - 🇭🇰 香港-手选
    - 🇭🇰 香港-智能
    interval: 300
