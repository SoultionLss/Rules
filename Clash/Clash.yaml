  proxies:
  - 良心云
  - 宝可梦
- name: 🇭🇰 香港-智能
  type: url-test
  proxies:
  - 良心云
  - 宝可梦
  url: http://1.1.1.1/generate_204
  interval: 600
- name: 🇭🇰 香港-故选
  type: fallback
  proxies:
  - 🇭🇰 香港-手选
  - 🇭🇰 香港-智能
