mode: rule
log-level: info
ipv6: false
allow-lan: false
external-controller: 127.0.0.1:9090
proxies: []
proxy-groups:
- name: 良心云
  type: select
  proxies:
  - DIRECT
- name: 宝可梦
  type: select
  proxies:
  - DIRECT
- name: 美国拼车
  type: select
  proxies:
