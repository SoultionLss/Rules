  type: select
  proxies:
  - 兜底节点
  - DIRECT
- name: Cloudflare
  type: select
  proxies:
  - 🇯🇵 日本-故选
  - 🇸🇬 狮城-故选
- name: 低倍率-手选
  type: select
  proxies:
  - 宝可梦
- name: 低倍率-智能
  type: url-test
  proxies:
  - 宝可梦
  url: http://1.1.1.1/generate_204
  interval: 600
- name: 低倍率-故选
  type: fallback
  proxies:
  - 低倍率-手选
  - 低倍率-智能
- name: 兜底节点
  type: select
  proxies:
  - 🇭🇰 香港-故选
  - 🇯🇵 日本-故选
  - 🇺🇸 美国-故选
  - 🇸🇬 狮城-故选
  - 🇹🇼 台湾-故选
